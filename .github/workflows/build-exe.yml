name: Build Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build Next standalone
        run: |
          npm ci
          npm run build
      - name: Electron unpacked build (no payload yet)
        run: |
          cd electron
          npm install
          npx electron-builder --win --dir
      - name: Assemble standalone payload into unpacked app
        shell: bash
        run: |
          set -x
          DEST="dist-installer/win-unpacked/resources/standalone"
          mkdir -p "$DEST/.next" "$DEST/public"
          cp -r .next/standalone/. "$DEST/"
          if [ -d .next/static ]; then cp -r .next/static "$DEST/.next/static"; fi
          if [ -d public ]; then cp -r public/. "$DEST/public/"; fi
          echo "Contents of $DEST:"; ls -a "$DEST"
          if [ -d "$DEST/node_modules/next" ]; then echo "OK: next module present"; else echo "FAIL: next module missing"; exit 1; fi
      - name: Package NSIS installer from prepared dir
        run: |
          cd electron
          npx electron-builder --win nsis --prepackaged ../dist-installer/win-unpacked
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete exe-latest -y --cleanup-tag || true
          gh release create exe-latest dist-installer/*.exe --title "Hishab Desktop" --notes "Windows installer; local data preserved across reinstalls."
